{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Custom styles moved to _sass/layout/_custom_overrides.scss and compiled in assets/css/main.scss -->
{%- if jekyll.environment != 'production' -%}
	<!-- LiveReload fallback: explicitly load the client in development -->
	<script defer src="http://localhost:35729/livereload.js?snipver=1"></script>
{%- endif -%}

<!-- Header layout overrides: keep header-specific CSS close to head -->
<style>
	.masthead__menu { position: relative; }
	/* Title on the left, language switch on the right, links centred in the
	   space between. Done with flex + auto margins so the header is already
	   laid out correctly before any script runs (no flash on page load) and
	   re-centres by itself when translation changes the label widths. */
	#site-nav.greedy-nav .visible-links {
		display: flex !important;
		align-items: center;
		width: 100%;
		padding-left: 0.75rem;
		padding-right: 2.75rem; /* room for the hamburger */
		box-sizing: border-box;
	}
	#site-nav.greedy-nav .visible-links > li { display: block !important; flex: 0 0 auto; }
	#site-nav.greedy-nav .visible-links > li:first-child { margin-right: auto; padding-right: 0; }
	#site-nav.greedy-nav .visible-links > li#theme-toggle { margin-left: auto; }
	#site-nav.greedy-nav .visible-links > li a { margin: 0 0.8rem; }
	#site-nav.greedy-nav .visible-links > li a:before { bottom: -2px; }
	@media (max-width: 899px) {
		#site-nav.greedy-nav .visible-links { min-height: 3rem; }
		#site-nav.greedy-nav .visible-links > li:not(.persist) { display: none !important; }
	}
</style>

<!-- end custom head snippets -->
